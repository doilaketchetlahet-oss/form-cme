name: Email campaigns cron

on:
  schedule:
    # Every 5 minutes (GitHub may delay a few minutes under load).
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  run-queue:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger email campaign queue
        run: |
          curl -sS -X GET "${{ secrets.APP_URL }}/api/cron/email-campaigns" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -w "HTTP %{http_code}\n" -o /tmp/resp.json
          cat /tmp/resp.json
