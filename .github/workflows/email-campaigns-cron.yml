name: Email campaigns cron

on:
  schedule:
    # Every 5 minutes (GitHub may delay a few minutes under load).
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  run-queue:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger email campaign queue
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not set in this repository"
            exit 1
          fi
          curl -fsS -X GET "https://dangkyhoithao.online/api/cron/email-campaigns" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -w "\nHTTP %{http_code}\n"
